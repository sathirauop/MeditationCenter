spring.application.name=MeditationCenter

# PostgreSQL Database Connection Settings
# Uses environment variables for security - see .env.example
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meditation_db}
spring.datasource.username=${DB_USERNAME:sathira97}
spring.datasource.password=${DB_PASSWORD}

# Flyway Migration Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# jOOQ Settings (optional - for debugging)
# spring.jooq.sql-dialect=POSTGRES

# Logging Configuration
logging.level.org.jooq=WARN

# JWT Security Settings
# IMPORTANT: Set JWT_SECRET environment variable in production!
# Generate with: openssl rand -base64 32
# All JWT settings loaded from environment variables - see .env.example
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
jwt.issuer=${JWT_ISSUER:meditation-center}

# Server Port (optional)
server.port=${SERVER_PORT:8080}

# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ============================================================================
# Cloudflare R2 Object Storage Configuration
# ============================================================================

# Enable/Disable R2 Integration
r2.enabled=${R2_ENABLED:false}

# R2 Connection Settings
r2.account-id=${R2_ACCOUNT_ID}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.endpoint=${R2_ENDPOINT}
r2.public-url=${R2_PUBLIC_URL}

# R2 Bucket Configuration
# Events bucket (cover images and gallery images)
r2.buckets.events.bucket-name=${R2_EVENTS_BUCKET_NAME:meditation-center-events}
r2.buckets.events.presigned-url-expiry=${R2_EVENTS_PRESIGNED_URL_EXPIRY:5m}

# Programs bucket (cover images and gallery images)
r2.buckets.programs.bucket-name=${R2_PROGRAMS_BUCKET_NAME:meditation-center-programs}
r2.buckets.programs.presigned-url-expiry=${R2_PROGRAMS_PRESIGNED_URL_EXPIRY:5m}

# Users bucket (avatar images)
r2.buckets.users.bucket-name=${R2_USERS_BUCKET_NAME:meditation-center-users}
r2.buckets.users.presigned-url-expiry=${R2_USERS_PRESIGNED_URL_EXPIRY:5m}

# Campaigns bucket (cover and banner images)
r2.buckets.campaigns.bucket-name=${R2_CAMPAIGNS_BUCKET_NAME:meditation-center-campaigns}
r2.buckets.campaigns.presigned-url-expiry=${R2_CAMPAIGNS_PRESIGNED_URL_EXPIRY:5m}

# Books bucket (PDF files and cover images)
r2.buckets.books.bucket-name=${R2_BOOKS_BUCKET_NAME:meditation-center-books}
r2.buckets.books.presigned-url-expiry=${R2_BOOKS_PRESIGNED_URL_EXPIRY:15m}

# Gallery bucket (gallery group photos)
r2.buckets.gallery.bucket-name=${R2_GALLERY_BUCKET_NAME:meditation-center-gallery}
r2.buckets.gallery.presigned-url-expiry=${R2_GALLERY_PRESIGNED_URL_EXPIRY:5m}

# ============================================================================
# Spring Cache Configuration (Caffeine)
# ============================================================================

spring.cache.type=caffeine
spring.cache.cache-names=eventImageUrls,programImageUrls,userImageUrls,campaignImageUrls
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=4m

# ============================================================================
# Multipart File Upload Configuration
# ============================================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB