# NGINX Configuration for Meditation Center
# Production setup with SSL, security headers, and reverse proxy
#
# Author: Sathira Basnayake

# Run NGINX as nginx user (security)
user nginx;

# Auto-detect number of CPU cores for worker processes
worker_processes auto;

# Error log location
error_log /var/log/nginx/error.log warn;

# Process ID file
pid /var/run/nginx.pid;

events {
    # Maximum number of simultaneous connections per worker
    worker_connections 1024;

    # Use efficient connection processing method
    use epoll;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Access log location
    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Hide NGINX version for security
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    # Rate limiting zone (prevent DDoS)
    # Allows 10 requests per second from same IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Upstream backend (Spring Boot app)
    upstream spring_boot_backend {
        # Use app service name from docker-compose
        server app:8080;

        # Keep connections alive
        keepalive 32;
    }

    # HTTP Server - Redirect all to HTTPS
    server {
        listen 80;
        listen [::]:80;

        # Replace with your actual domain
        server_name meditation.example.com www.meditation.example.com;

        # Let's Encrypt ACME challenge (for SSL certificate generation)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        # Replace with your actual domain
        server_name meditation.example.com www.meditation.example.com;

        # SSL Certificate paths (Let's Encrypt)
        # Replace meditation.example.com with your domain
        ssl_certificate /etc/letsencrypt/live/meditation.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/meditation.example.com/privkey.pem;

        # SSL Configuration (Strong security)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # OCSP Stapling (improves SSL handshake performance)
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/meditation.example.com/chain.pem;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Max upload size (for file uploads)
        client_max_body_size 10M;

        # Root location - proxy to Spring Boot
        location / {
            # Apply rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            # Proxy headers
            proxy_pass http://spring_boot_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Health check endpoint (no rate limiting)
        location /actuator/health {
            proxy_pass http://spring_boot_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;  # Don't log health checks
        }

        # Static files caching (if you serve static files)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
            proxy_pass http://spring_boot_backend;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
