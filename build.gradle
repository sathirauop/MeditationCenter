plugins {
    id 'java'
    id 'java-test-fixtures'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jooq.jooq-codegen-gradle' version '3.20.0'
}

group = 'com.isipathana'
version = '0.0.1-SNAPSHOT'
description = 'MeditationCenter'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// Ensure Lombok is available for all compilation tasks
compileJava {
    options.compilerArgs += ['-parameters']
    // Enable annotation processing explicitly
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs += ['-proc:full']
}

repositories {
    mavenCentral()
}

ext {
    jooqVersion = '3.20.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    // JWT dependencies
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // AWS SDK for S3 (Cloudflare R2 compatible)
    implementation 'software.amazon.awssdk:s3:2.21.20'
    implementation 'software.amazon.awssdk:auth:2.21.20'

    // Force jOOQ version to match code generation version
    implementation "org.jooq:jooq:${jooqVersion}"

    // jOOQ code generation dependencies
    // DDL Database extension to generate from SQL files (no database needed!)
    jooqCodegen "org.jooq:jooq-meta-extensions:${jooqVersion}"
    jooqCodegen 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:postgresql:1.19.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Test Fixtures dependencies (for shared test utilities)
    testFixturesAnnotationProcessor 'org.projectlombok:lombok'
    testFixturesCompileOnly 'org.projectlombok:lombok'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-jooq'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesImplementation 'org.testcontainers:junit-jupiter'
    testFixturesImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}

// jOOQ Configuration
// IMPORTANT: Generates jOOQ code from Flyway SQL migrations (no database needed!)
// This approach works perfectly in Docker builds
jooq {
    version = '3.20.0'

    String flywayMigrationPath = "${layout.projectDirectory}/src/main/resources/db/migration"
    String jooqGeneratedDir = "${layout.projectDirectory}/src/jooq/java"

    configuration {
        logging = org.jooq.meta.jaxb.Logging.DEBUG

        // Handle metadata errors gracefully
        onError = org.jooq.meta.jaxb.OnError.LOG

        // NO JDBC CONNECTION NEEDED!
        // jOOQ reads SQL files directly using DDLDatabase

        generator {
            name = 'org.jooq.codegen.JavaGenerator'

            database {
                // Use DDLDatabase to read from SQL files (Flyway migrations)
                name = 'org.jooq.meta.extensions.ddl.DDLDatabase'

                // Specify the schema to use (H2 uses PUBLIC by default)
                inputSchema = 'PUBLIC'

                // Configure DDL Database to read Flyway migrations
                properties {
                    // Point to ALL Flyway migration files
                    property {
                        key = 'scripts'
                        value = "${flywayMigrationPath}/V*create*.sql"
                    }

                    // Sort scripts by name (V1, V2, V3, etc.)
                    property {
                        key = 'sort'
                        value = 'flyway'
                    }

                    // Default schema name
                    property {
                        key = 'defaultNameCase'
                        value = 'lower'
                    }

                    // Unqualified schema (use 'public' as default)
                    property {
                        key = 'unqualifiedSchema'
                        value = 'none'
                    }

                    // Parse ignore comments to handle seed data files better
                    property {
                        key = 'parseIgnoreComments'
                        value = 'true'
                    }
                }

                forcedTypes {
                    // User role enum
                    forcedType {
                        priority = 2
                        name = 'enum'
                        userType = 'com.isipathana.meditationcenter.records.user.UserRole'
                        converter = 'com.isipathana.meditationcenter.jooq.converter.EnumColumnConverter'
                        genericConverter = true
                        includeExpression = 'users\\.role'
                    }

                    // Booking type enum
                    forcedType {
                        priority = 2
                        name = 'enum'
                        userType = 'com.isipathana.meditationcenter.records.booking.BookingType'
                        converter = 'com.isipathana.meditationcenter.jooq.converter.EnumColumnConverter'
                        genericConverter = true
                        includeExpression = 'booking\\.booking_type'
                    }

                    // Booking status enum
                    forcedType {
                        priority = 2
                        name = 'enum'
                        userType = 'com.isipathana.meditationcenter.records.booking.BookingStatus'
                        converter = 'com.isipathana.meditationcenter.jooq.converter.EnumColumnConverter'
                        genericConverter = true
                        includeExpression = 'booking\\.status'
                    }

                    // Payment status enum
                    forcedType {
                        priority = 2
                        name = 'enum'
                        userType = 'com.isipathana.meditationcenter.records.payment.PaymentStatus'
                        converter = 'com.isipathana.meditationcenter.jooq.converter.EnumColumnConverter'
                        genericConverter = true
                        includeExpression = 'payment\\.status'
                    }

                    // Payment method enum
                    forcedType {
                        priority = 2
                        name = 'enum'
                        userType = 'com.isipathana.meditationcenter.records.payment.PaymentMethod'
                        converter = 'com.isipathana.meditationcenter.jooq.converter.EnumColumnConverter'
                        genericConverter = true
                        includeExpression = 'payment\\.payment_method'
                    }

                    // Event registration status enum
                    forcedType {
                        priority = 2
                        name = 'enum'
                        userType = 'com.isipathana.meditationcenter.records.event.EventRegistrationStatus'
                        converter = 'com.isipathana.meditationcenter.jooq.converter.EnumColumnConverter'
                        genericConverter = true
                        includeExpression = 'event_registration\\.status'
                    }

                    // Boolean type mapping
                    forcedType {
                        priority = 1
                        name = 'BOOLEAN'
                        includeTypes = '(?i:BOOLEAN)'
                    }

                    // LocalDateTime type mapping
                    forcedType {
                        priority = 1
                        name = 'timestamp'
                        userType = 'java.time.LocalDateTime'
                        includeTypes = '(?i:TIMESTAMP)'
                    }
                }
            }

            target {
                packageName = 'com.isipathana.meditationcenter.jooq'
                directory = jooqGeneratedDir
            }
        }
    }
}

// Add generated source directory
java {
    sourceSets {
        main {
            java {
                srcDir('src/jooq/java')
            }
        }
    }
}

// Task dependencies
tasks.named('compileJava') {
    dependsOn tasks.named('jooqCodegen')
}

tasks.named('build') {
    dependsOn tasks.named('jooqCodegen')
}

tasks.named('bootJar') {
    dependsOn tasks.named('jooqCodegen')
}

// Custom task to clean and build
tasks.register('cleanBuild') {
    group = 'build'
    description = 'Cleans and builds the project'
    dependsOn tasks.named('clean'), tasks.named('build')
    tasks.named('build').get().mustRunAfter(tasks.named('clean'))
}
